[project]
name = "aift-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=44",
    "httpx>=0.28,<1",
    "idna>=3.10,<4",
    "jsonschema>=4.23,<5",
    "python-dateutil>=2.9,<3",
    "portalocker>=3,<4",
    "ecologits==0.11.2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../packages/estimator/python", "../../packages/contracts/python"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
