[project]
name = "aift-anthropic-calibration"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["anthropic==1.4.0"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.15.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
